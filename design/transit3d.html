<title>Fourgon Lussier 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;900&family=Instrument+Serif&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
  :root {
    --ambre: #ffb524;
    --ambre-doux: #ffd180;
    --encre: #07090c;
    --blanc: #fff;
    --texte: #14161a;
    --texte-doux: #5f6470;
    --trait: #e9e6e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--encre); }
  body { font-family: Archivo, Arial, sans-serif; color: var(--blanc); -webkit-font-smoothing: antialiased; }

  #vue { position: fixed; inset: 0; display: block; touch-action: none; }
  #vue.pointe { cursor: pointer; }

  .voile {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    background: var(--encre);
    transition: opacity .6s ease;
  }
  .voile p {
    font-family: "JetBrains Mono", monospace;
    font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ambre-doux);
  }
  .voile.parti { opacity: 0; pointer-events: none; }

  .barre {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: calc(20px + env(safe-area-inset-top,0px)) 22px 20px;
    pointer-events: none;
  }
  .barre > * { pointer-events: auto; }
  .lockup { display: inline-flex; flex-direction: column; line-height: 1; }
  .lockup .mot {
    display: inline-flex; align-items: center;
    font-size: 1.28rem; font-weight: 900; letter-spacing: -.035em;
    text-shadow: 0 2px 16px rgba(0,0,0,.8);
  }
  .lockup .sous { margin-top: .46em; font-size: .54rem; font-weight: 600; letter-spacing: .36em; color: var(--ambre-doux); }
  .lockup svg { width: .34em; height: 1em; margin-inline: .07em; flex: none; transform: translateY(.03em); fill: var(--ambre); }

  .tel {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(7,9,12,.6); backdrop-filter: blur(8px);
    font-family: "Instrument Serif", Georgia, serif; font-size: 1.2rem;
    color: var(--blanc); text-decoration: none; white-space: nowrap;
  }
  .tel:hover { border-color: var(--ambre); }
  .tel i { width: 7px; height: 7px; border-radius: 999px; background: var(--ambre); animation: pouls 2.4s ease-out infinite; }
  @keyframes pouls {
    0% { box-shadow: 0 0 0 0 rgba(255,181,36,.6); }
    70% { box-shadow: 0 0 0 13px rgba(255,181,36,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,181,36,0); }
  }

  .etiquette {
    position: fixed; z-index: 22;
    transform: translate(-50%, -140%);
    padding: 6px 12px; border-radius: 3px;
    background: rgba(7,9,12,.94);
    border: 1px solid rgba(255,181,36,.55);
    font-family: "JetBrains Mono", monospace;
    font-size: .64rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ambre-doux); white-space: nowrap;
    opacity: 0; transition: opacity .18s ease; pointer-events: none;
  }
  .etiquette.on { opacity: 1; }

  .invite {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom,0px));
    transform: translateX(-50%); z-index: 20; text-align: center;
    max-width: min(90vw, 30rem); pointer-events: none;
  }
  .invite h1 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: clamp(1.35rem, 4vw, 2.1rem); line-height: 1.1; margin: 0;
    text-shadow: 0 2px 22px rgba(0,0,0,.9); text-wrap: balance;
  }
  .invite p { margin: 8px 0 0; font-size: .8rem; color: rgba(255,255,255,.62); text-shadow: 0 1px 10px rgba(0,0,0,.9); }

  .panneau {
    position: fixed; inset: 0; z-index: 40;
    display: flex; justify-content: flex-end;
    background: rgba(4,5,7,.5); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .panneau[data-ouvert="oui"] { opacity: 1; pointer-events: auto; }
  .tiroir {
    width: min(460px, 100%); height: 100%; overflow-y: auto;
    background: var(--blanc); color: var(--texte);
    border-left: 3px solid var(--ambre);
    padding: calc(28px + env(safe-area-inset-top,0px)) 28px calc(28px + env(safe-area-inset-bottom,0px));
    transform: translateX(26px); transition: transform .34s cubic-bezier(.22,.61,.36,1);
  }
  .panneau[data-ouvert="oui"] .tiroir { transform: none; }
  .tiroir .haut { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .marqueur { margin: 0; font-family: "JetBrains Mono", monospace; font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #8a5a00; }
  .tiroir h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(1.6rem,5vw,2.1rem); line-height: 1.12; margin: 10px 0 0; text-wrap: balance; }
  .resume { margin: 13px 0 0; color: var(--texte-doux); font-size: .97rem; line-height: 1.7; }
  .tiroir ul { margin: 20px 0 0; padding: 0; list-style: none; }
  .tiroir li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--trait); font-size: .92rem; line-height: 1.6; }
  .tiroir li::before { content: ""; flex: none; margin-top: 9px; width: 5px; height: 5px; border-radius: 999px; background: var(--ambre); }
  .pied { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 24px; }
  .bouton { display: inline-flex; align-items: center; border-radius: 999px; padding: 12px 24px; font-size: .87rem; font-weight: 500; text-decoration: none; background: var(--texte); color: var(--blanc); }
  .tel-t { font-family: "Instrument Serif", Georgia, serif; font-size: 1.4rem; color: var(--texte); text-decoration: none; }
  .fermer { flex: none; border: 1px solid var(--trait); background: var(--blanc); color: var(--texte); width: 34px; height: 34px; border-radius: 999px; font-size: 1rem; cursor: pointer; }
  .note { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--trait); font-size: .74rem; line-height: 1.6; color: var(--texte-doux); }

  @media (max-width: 720px) {
    .tiroir { width: 100%; padding-inline: 20px; }
    .panneau { justify-content: center; }
    .tel { font-size: 1rem; padding: 7px 13px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>

    apropos: { m: "Sur la cloison", t: "Antoine Lussier, maître électricien",
      r: "Une entreprise d’électricité établie à Drummondville, au service du résidentiel et du commercial.",
      p: ["Licence RBQ en règle", "Membre de la CMEQ", "Assurance responsabilité",
          "Soumission écrite avant les travaux", "Main-d’œuvre garantie"] },
    territoire: { m: "Caisse ouverte", t: "Territoire desservi",
      r: "Basé à Drummondville. Si votre ville n’est pas dans la liste, appelez quand même.",
      p: ["Drummondville", "Saint-Cyrille-de-Wendover", "Saint-Germain-de-Grantham",
          "Wickham", "Victoriaville", "Nicolet et Bécancour"] },
    soumission: { m: "La grosse caisse", t: "Demander une soumission",
      r: "Gratuite, sans engagement. Plus votre description est précise, plus le chiffre sera juste.",
      p: ["Réponse sous un jour ouvrable", "Soumission écrite et détaillée",
          "Le prix annoncé est le prix payé", "Un imprévu ? On appelle avant de continuer",
          "Pour une urgence, le téléphone reste le plus rapide"] }
  }
  var ETIQ = {
    urgence: "Urgence 24/7", panneau: "Panneau électrique", borne: "Bornes de recharge",
    renovation: "Rénovation", commercial: "Commercial", normes: "Mise aux normes",
    apropos: "Le maître électricien", territoire: "Territoire", soumission: "Soumission"
  }

  var canvas = document.getElementById("vue")
  var rendu = new THREE.WebGLRenderer({ canvas: canvas, antialias: true })
  rendu.setPixelRatio(Math.min(devicePixelRatio, 2))
  rendu.outputEncoding = THREE.sRGBEncoding
  rendu.toneMapping = THREE.ACESFilmicToneMapping
  rendu.toneMappingExposure = 0.78
  rendu.shadowMap.enabled = true
  rendu.shadowMap.type = THREE.PCFSoftShadowMap

  var scene = new THREE.Scene()
  scene.background = new THREE.Color(0x07090c)

  // L'environnement donne aux plastiques leurs reflets : sans lui, tout
  // paraît mat et plat.
  var pmrem = new THREE.PMREMGenerator(rendu)
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture
  // RoomEnvironment est une pièce éclairée : à pleine intensité elle crame
  // l'habitacle. On ne garde que ce qu'il faut pour les reflets du plastique.
  var ENV = 0.16

  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 60)
  camera.position.set(0, 1.18, 2.45)

  var ctrl = new THREE.OrbitControls(camera, canvas)
  ctrl.target.set(0, 0.95, -1.5)
  ctrl.enableDamping = true
  ctrl.dampingFactor = 0.08
  ctrl.minDistance = 1.2
  ctrl.maxDistance = 4.2
  ctrl.minPolarAngle = Math.PI * 0.22
  ctrl.maxPolarAngle = Math.PI * 0.72
  ctrl.minAzimuthAngle = -0.62
  ctrl.maxAzimuthAngle = 0.62
  ctrl.enablePan = false

  // Éclairage : la rampe du plafond est la clé, le reste n'est que remplissage.
  scene.add(new THREE.HemisphereLight(0x8899bb, 0x0a0c10, 0.10))

  var rampe = new THREE.SpotLight(0xfff0d6, 3.6, 7, Math.PI * 0.42, 0.55, 1.4)
  rampe.position.set(0, 1.84, -1.05)
  rampe.target.position.set(0, 0.85, -1.84)
  rampe.castShadow = true
  rampe.shadow.mapSize.set(1024, 1024)
  rampe.shadow.bias = -0.0012
  scene.add(rampe, rampe.target)

  var avant = new THREE.SpotLight(0xffeccc, 1.7, 6, Math.PI * 0.5, 0.6, 1.5)
  avant.position.set(0, 1.8, -0.2)
  avant.target.position.set(0, 0.9, -1.84)
  scene.add(avant, avant.target)

  var bleu = new THREE.DirectionalLight(0x6f92ff, 0.28)
  bleu.position.set(0.6, 1.4, 3)
  scene.add(bleu)

  var cibles = []
  var repos = new Map()
  var survol = null
  var choisie = null

  // Le modèle est embarqué dans la page : l'extension .glb n'est pas servie
  // comme fichier joint, et un seul fichier évite un aller-retour réseau.
  var GLB_B64 = document.getElementById("modele").textContent.trim()
  function versBuffer(b64) {
    var bin = atob(b64)
    var u = new Uint8Array(bin.length)
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i)
    return u.buffer
  }

  var loader = new THREE.GLTFLoader()
  loader.parse(versBuffer(GLB_B64), "", function (gltf) {
    gltf.scene.traverse(function (o) {
      if (o.isMesh) {
        o.castShadow = true
        o.receiveShadow = true
        ;(Array.isArray(o.material) ? o.material : [o.material]).forEach(function (m) {
          if (m) m.envMapIntensity = ENV
        })
      }
      // Une caisse a deux matériaux, donc deux primitives : glTF en fait un
      // groupe nommé contenant des `Mesh` anonymes. Filtrer sur `isMesh`
      // ratait toutes les cibles — on vise le nœud nommé, quel qu'il soit.
      if (o.name.indexOf("Caisse_") === 0) {
        o.userData.cle = o.name.slice(7)
        cibles.push(o)
        repos.set(o, o.position.clone())
      }
    })
    scene.add(gltf.scene)
    document.getElementById("voile").classList.add("parti")
    setTimeout(function () { document.getElementById("voile").remove() }, 700)
  }, function () {
    document.getElementById("voile").innerHTML =
      '<p style="color:#ff9c9c">La scène 3D n’a pas pu charger.</p>'
  })

  var ray = new THREE.Raycaster()
  var souris = new THREE.Vector2()
  var etiq = document.getElementById("etiquette")
  var survolPossible = matchMedia("(hover: hover) and (pointer: fine)").matches

  function viser(e) {
    var r = canvas.getBoundingClientRect()
    souris.x = ((e.clientX - r.left) / r.width) * 2 - 1
    souris.y = -((e.clientY - r.top) / r.height) * 2 + 1
    ray.setFromCamera(souris, camera)
    var touche = ray.intersectObjects(cibles, true)
    if (!touche.length) return null
    // Remonter du sous-maillage touché jusqu'au nœud qui porte la section.
    var n = touche[0].object
    while (n && n.name.indexOf("Caisse_") !== 0) n = n.parent
    return n || null
  }

  if (survolPossible) {
    canvas.addEventListener("pointermove", function (e) {
      var o = viser(e)
      survol = o
      canvas.classList.toggle("pointe", !!o)
      if (o) {
        etiq.textContent = ETIQ[o.userData.cle]
        etiq.style.left = e.clientX + "px"
        etiq.style.top = e.clientY + "px"
        etiq.classList.add("on")
      } else {
        etiq.classList.remove("on")
      }
    })
  }

  canvas.addEventListener("pointerdown", function (e) { canvas._x = e.clientX; canvas._y = e.clientY })
  canvas.addEventListener("pointerup", function (e) {
    // Un glissé fait tourner la caméra ; seul un vrai clic ouvre une caisse.
    if (Math.abs(e.clientX - canvas._x) > 6 || Math.abs(e.clientY - canvas._y) > 6) return
    var o = viser(e)
    if (o) ouvrir(o)
  })

  var panneau = document.getElementById("panneau")
  var volA = null, volB = null, volT = 0

  function ouvrir(o) {
    choisie = o
    var s = SECTIONS[o.userData.cle]
    document.getElementById("m-sec").textContent = s.m
    document.getElementById("t-sec").textContent = s.t
    document.getElementById("r-sec").textContent = s.r
    var ul = document.getElementById("l-sec")
    ul.innerHTML = ""
    s.p.forEach(function (p) {
      var li = document.createElement("li"); li.textContent = p; ul.appendChild(li)
    })
    panneau.setAttribute("data-ouvert", "oui")
    document.getElementById("invite").style.opacity = 0
    etiq.classList.remove("on")

    // La caméra plonge vers la caisse choisie.
    var p = repos.get(o)
    volA = { pos: camera.position.clone(), cible: ctrl.target.clone() }
    volB = {
      pos: new THREE.Vector3(p.x * 0.55, p.y + 0.18, p.z + 1.25),
      cible: new THREE.Vector3(p.x, p.y, p.z)
    }
    volT = 0
  }

  function fermer() {
    panneau.setAttribute("data-ouvert", "non")
    document.getElementById("invite").style.opacity = ""
    var p = choisie && repos.get(choisie)
    volA = { pos: camera.position.clone(), cible: ctrl.target.clone() }
    volB = { pos: new THREE.Vector3(0, 1.18, 2.45), cible: new THREE.Vector3(0, 0.95, -1.5) }
    volT = 0
    choisie = null
  }
  document.getElementById("fermer").addEventListener("click", fermer)
  panneau.addEventListener("click", function (e) { if (e.target === panneau) fermer() })
  addEventListener("keydown", function (e) {
    if (e.key === "Escape" && panneau.getAttribute("data-ouvert") === "oui") fermer()
  })

  function dimensionner() {
    var l = innerWidth, h = innerHeight
    camera.aspect = l / h
    camera.updateProjectionMatrix()
    rendu.setSize(l, h, false)
  }
  addEventListener("resize", dimensionner)
  dimensionner()

  var horloge = new THREE.Clock()
  function boucle() {
    requestAnimationFrame(boucle)
    var dt = Math.min(horloge.getDelta(), 0.05)

    // Les caisses sortent du rack : celle survolée, et celle qu'on a ouverte.
    cibles.forEach(function (o) {
      var base = repos.get(o)
      var vise = base.z + (o === choisie ? 0.30 : (o === survol ? 0.10 : 0))
      o.position.z += (vise - o.position.z) * Math.min(1, dt * 9)
    })

    if (volA && volB) {
      volT = Math.min(1, volT + dt * 1.15)
      var k = volT < 0.5 ? 4 * volT * volT * volT : 1 - Math.pow(-2 * volT + 2, 3) / 2
      camera.position.lerpVectors(volA.pos, volB.pos, k)
      ctrl.target.lerpVectors(volA.cible, volB.cible, k)
      if (volT >= 1) { volA = volB = null }
    }

    ctrl.update()
    rendu.render(scene, camera)
  }
  boucle()
})()
</script>
