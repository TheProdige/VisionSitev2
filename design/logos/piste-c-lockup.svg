       mi-hauteur), le pied reste horizontal. La lettre et le symbole sont
       la même forme, pas deux objets posés l'un à côté de l'autre. -->
  <path d="M 30.5 18 L 48.5 18 L 39.5 44 L 49.5 44 L 42.5 60 L 75.5 60 L 75.5 78 L 22.5 78 L 30.5 44 L 20.5 44 Z" fill="#22D3EE"/>
  <g font-family="'Space Grotesk', sans-serif" fill="#16181D">
    <text x="120" y="52" font-size="42" font-weight="700" letter-spacing="0.5">LUSSIER</text>
    <text x="121" y="76" font-size="14" font-weight="500" letter-spacing="7">ÉLECTRIQUE</text>
  </g>
</svg>
