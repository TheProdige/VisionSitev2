<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de zones — héro Lussier</title>
<style>
/* Outil local. Il ne part pas en production : il sert à corriger à la main
   les polygones de src/components/hero/hero-zones.json quand l'image change. */
:root{--nuit:#0b0f18;--trait:#2a3242;--texte:#e9edf5;--gris:#98a2b5;--ambre:#ffb524}
*{box-sizing:border-box}
body{margin:0;background:var(--nuit);color:var(--texte);
  font:14px/1.5 ui-sans-serif,system-ui,sans-serif;display:grid;grid-template-columns:1fr 310px;height:100vh}
canvas{display:block;background:#000;cursor:crosshair}
.scene{position:relative;overflow:auto;display:grid;place-items:center;padding:1rem}
aside{border-left:1px solid var(--trait);padding:1rem;overflow:auto;display:grid;gap:.85rem;align-content:start}
h1{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ambre);margin:0;font-weight:600}
.aide{color:var(--gris);font-size:.78rem}
kbd{background:#1a2132;border:1px solid var(--trait);border-radius:3px;padding:.05rem .3rem;font-size:.72rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
li button{width:100%;text-align:left;background:none;border:1px solid transparent;color:inherit;
  padding:.35rem .5rem;border-radius:3px;cursor:pointer;font:inherit;display:flex;gap:.5rem;align-items:center}
li button:hover{background:#151c2b}
li button[aria-current=true]{background:#1d2740;border-color:var(--ambre)}
.pastille{width:10px;height:10px;border-radius:2px;flex:none}
.rangee{display:flex;gap:.4rem;flex-wrap:wrap}
button.action{flex:1;background:#151c2b;border:1px solid var(--trait);color:inherit;
  padding:.45rem;border-radius:3px;cursor:pointer;font:inherit;font-size:.8rem}
button.action:hover{border-color:var(--ambre)}
textarea{width:100%;height:150px;background:#0e1420;color:var(--gris);border:1px solid var(--trait);
  border-radius:3px;padding:.5rem;font-family:ui-monospace,monospace;font-size:.68rem;resize:vertical}
input[type=file]{font-size:.75rem;color:var(--gris)}
</style>
</head>
<body>
<div class="scene"><canvas id="toile"></canvas></div>
<aside>
  <h1>Zones du héro</h1>
  <p class="aide">
    <kbd>clic</kbd> sur un point pour le saisir · <kbd>glisser</kbd> pour le déplacer ·
    <kbd>alt+clic</kbd> sur une arête pour insérer un point ·
    <kbd>suppr</kbd> retire le point saisi · <kbd>maj+clic</kbd> ajoute un point en fin de polygone.
  </p>
  <label class="aide">Image (facultatif, sinon celle du dépôt)<br><input type="file" id="fichier" accept="image/*"></label>
  <label class="aide">Charger un hero-zones.json<br><input type="file" id="json" accept="application/json,.json"></label>
  <ul id="liste"></ul>
  <div class="rangee">
    <button class="action" id="copier">Copier le JSON</button>
    <button class="action" id="telecharger">Télécharger</button>
  </div>
  <textarea id="sortie" readonly spellcheck="false"></textarea>
</aside>

<script>
const TEINTES = {sky:"#5a8fd6",trees:"#ff7a28",soffits:"#ffd25a",windows:"#ffb43c",
                 path:"#78ffa0",ev:"#50b4ff",driveway:"#c878ff"};
const CHEMIN_DEFAUT = "../public/images/hero/source/house-lit.png";
const JSON_DEFAUT = "../src/components/hero/hero-zones.json";

const toile = document.getElementById("toile"), ctx = toile.getContext("2d");
let image = new Image(), donnees = null, active = 0, saisi = null;

function ajuster(){
  const max = Math.min(window.innerWidth - 360, 1280);
  const l = Math.min(max, image.naturalWidth || max);
  toile.width = l; toile.height = Math.round(l * (image.naturalHeight || 9) / (image.naturalWidth || 16));
  dessiner();
}

function dessiner(){
  const {width:L, height:H} = toile;
  ctx.clearRect(0,0,L,H);
  if (image.naturalWidth) ctx.drawImage(image, 0, 0, L, H);
  if (!donnees) return;
  donnees.zones.forEach((zone, i)=>{
    const couleur = TEINTES[zone.groupe] || "#ffffff";
    const vif = i === active;
    zone.polygones.forEach(poly=>{
      ctx.beginPath();
      poly.forEach(([x,y],k)=> k ? ctx.lineTo(x*L, y*H) : ctx.moveTo(x*L, y*H));
      ctx.closePath();
      ctx.fillStyle = couleur + (vif ? "55" : "22");
      ctx.strokeStyle = couleur; ctx.lineWidth = vif ? 2 : 1;
      ctx.fill(); ctx.stroke();
      if (!vif) return;
      poly.forEach(([x,y],k)=>{
        ctx.beginPath(); ctx.arc(x*L, y*H, 5, 0, 7);
        ctx.fillStyle = (saisi && saisi.poly === poly && saisi.k === k) ? "#fff" : couleur;
        ctx.fill(); ctx.strokeStyle = "#0b0f18"; ctx.lineWidth = 1.5; ctx.stroke();
      });
    });
  });
}

function pointSous(ex, ey){
  const {width:L, height:H} = toile;
  const zone = donnees.zones[active];
  for (const poly of zone.polygones)
    for (let k = 0; k < poly.length; k++)
      if (Math.hypot(poly[k][0]*L - ex, poly[k][1]*H - ey) < 9) return {poly, k};
  return null;
}

function areteSous(ex, ey){
  const {width:L, height:H} = toile;
  const zone = donnees.zones[active];
  let meilleur = null;
  for (const poly of zone.polygones)
    for (let k = 0; k < poly.length; k++){
      const a = poly[k], b = poly[(k+1) % poly.length];
      const ax = a[0]*L, ay = a[1]*H, bx = b[0]*L, by = b[1]*H;
      const dx = bx-ax, dy = by-ay, l2 = dx*dx + dy*dy || 1;
      const t = Math.max(0, Math.min(1, ((ex-ax)*dx + (ey-ay)*dy) / l2));
      const d = Math.hypot(ax + dx*t - ex, ay + dy*t - ey);
      if (d < 10 && (!meilleur || d < meilleur.d)) meilleur = {poly, k, d, x:(ax+dx*t)/L, y:(ay+dy*t)/H};
    }
  return meilleur;
}

toile.addEventListener("pointerdown", e=>{
  if (!donnees) return;
  const r = toile.getBoundingClientRect();
  const ex = e.clientX - r.left, ey = e.clientY - r.top;
  if (e.altKey){
    const a = areteSous(ex, ey);
    if (a){ a.poly.splice(a.k + 1, 0, [a.x, a.y]); saisi = {poly:a.poly, k:a.k + 1}; sortir(); return; }
  }
  if (e.shiftKey){
    const poly = donnees.zones[active].polygones[0];
    poly.push([ex / toile.width, ey / toile.height]);
    saisi = {poly, k:poly.length - 1}; sortir(); return;
  }
  saisi = pointSous(ex, ey);
  if (saisi) toile.setPointerCapture(e.pointerId);
  dessiner();
});

toile.addEventListener("pointermove", e=>{
  if (!saisi) return;
  const r = toile.getBoundingClientRect();
  saisi.poly[saisi.k] = [
    Math.max(0, Math.min(1, (e.clientX - r.left) / toile.width)),
    Math.max(0, Math.min(1, (e.clientY - r.top) / toile.height)),
  ];
  sortir();
});
toile.addEventListener("pointerup", ()=> { if (saisi) toile.releasePointerCapture?.(0); });

addEventListener("keydown", e=>{
  if (e.key !== "Delete" && e.key !== "Backspace") return;
  if (!saisi || saisi.poly.length <= 3) return;
  e.preventDefault();
  saisi.poly.splice(saisi.k, 1); saisi = null; sortir();
});

function listeZones(){
  document.getElementById("liste").innerHTML = donnees.zones.map((z,i)=>
    `<li><button type="button" data-i="${i}" aria-current="${i === active}">
       <span class="pastille" style="background:${TEINTES[z.groupe] || "#fff"}"></span>
       ${z.libelle || z.id}</button></li>`).join("");
}
document.getElementById("liste").addEventListener("click", e=>{
  const b = e.target.closest("[data-i]"); if (!b) return;
  active = +b.dataset.i; saisi = null; listeZones(); dessiner();
});

const arrondi = o => JSON.parse(JSON.stringify(o, (c,v)=> typeof v === "number" ? +v.toFixed(4) : v));
function sortir(){
  document.getElementById("sortie").value = JSON.stringify(arrondi(donnees), null, 2);
  dessiner();
}
document.getElementById("copier").addEventListener("click", async e=>{
  await navigator.clipboard.writeText(document.getElementById("sortie").value);
  e.target.textContent = "Copié"; setTimeout(()=> e.target.textContent = "Copier le JSON", 1200);
});
document.getElementById("telecharger").addEventListener("click", ()=>{
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([document.getElementById("sortie").value], {type:"application/json"}));
  a.download = "hero-zones.json"; a.click(); URL.revokeObjectURL(a.href);
});

document.getElementById("fichier").addEventListener("change", e=>{
  const f = e.target.files[0]; if (!f) return;
  image = new Image(); image.onload = ajuster; image.src = URL.createObjectURL(f);
});
document.getElementById("json").addEventListener("change", async e=>{
  const f = e.target.files[0]; if (!f) return;
  donnees = JSON.parse(await f.text()); active = 0; saisi = null; listeZones(); sortir();
});

addEventListener("resize", ajuster);

// Ouvert par double-clic (file://), fetch est bloqué : on charge alors les
// fichiers à la main avec les deux sélecteurs ci-dessus.
(async ()=>{
  image.onload = ajuster;
  image.onerror = ()=> { ajuster(); };
  image.src = CHEMIN_DEFAUT;
  try {
    donnees = await (await fetch(JSON_DEFAUT)).json();
  } catch (err) {
    document.getElementById("sortie").value =
      "Chargement automatique impossible (page ouverte en file://).\n" +
      "Servez le dossier — par exemple `python3 -m http.server` à la racine du projet —\n" +
      "ou chargez l'image et le JSON avec les deux sélecteurs ci-dessus.";
    return;
  }
  listeZones(); sortir();
})();
</script>
</body>
</html>
